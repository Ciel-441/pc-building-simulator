<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PC Hardware Architect - 3D Rig Simulation & Performance Lab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2306090e'/><rect x='6' y='6' width='20' height='20' rx='3' fill='none' stroke='%2310f06a' stroke-width='2.5'/><rect x='11' y='11' width='10' height='10' fill='%2310f06a'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
:root {
  --bg-studio: #06090e;
  --bg-panel: rgba(9, 13, 19, 0.90);
  --bg-panel-solid: #0a0f17;
  --bg-card: rgba(14, 20, 29, 0.88);
  --bg-card-hover: rgba(19, 27, 39, 0.95);
  --border-panel: rgba(148, 163, 184, 0.14);
  --border-panel-strong: rgba(148, 163, 184, 0.25);
  --border-panel-hover: rgba(16, 240, 106, 0.48);
  --text-white: #f8fafc;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --accent-emerald: #10f06a;
  --accent-lime: #84cc16;
  --accent-sky: #38bdf8;
  --accent-amber: #f59e0b;
  --accent-crimson: #ef4444;
  --font-display: 'Space Grotesk', system-ui, -apple-system, sans-serif;
  --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sidebar-w: 444px;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-font-smoothing: antialiased;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden !important;
  background: radial-gradient(circle at 38% 45%, #0d1420 0%, #06090e 72%);
  color: var(--text-white);
  font-family: var(--font-sans);
  user-select: none;
}

.tabular {
  font-variant-numeric: tabular-nums;
}

/* 3D Canvas Viewport */
#viewport-container {
  position: absolute;
  inset: 0;
  z-index: 1;
  cursor: grab;
}
#viewport-container:active {
  cursor: grabbing;
}
canvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Top Telemetry HUD */
.spatial-hud {
  position: absolute;
  top: 14px;
  left: 14px;
  right: calc(var(--sidebar-w) + 28px);
  z-index: 12;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
  transition: right 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.spatial-hud.expanded {
  right: 170px;
}

.hud-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: var(--bg-panel);
  backdrop-filter: blur(22px) saturate(135%);
  -webkit-backdrop-filter: blur(22px) saturate(135%);
  border: 1px solid var(--border-panel);
  border-radius: 10px;
  padding: 9px 16px;
  pointer-events: auto;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 16px 36px rgba(0, 0, 0, 0.55);
  min-height: 54px;
}

.brand-cluster {
  display: flex;
  align-items: center;
  gap: 11px;
  min-width: 0;
}
.brand-logo-badge {
  background: rgba(16, 240, 106, 0.12);
  color: var(--accent-emerald);
  border: 1px solid rgba(16, 240, 106, 0.42);
  font-family: var(--font-mono);
  font-weight: 800;
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 5px;
  letter-spacing: 1px;
  white-space: nowrap;
  flex-shrink: 0;
}
.brand-text-wrap {
  min-width: 0;
}
.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 13.5px;
  letter-spacing: 0.2px;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-tag {
  font-size: 9.5px;
  font-weight: 500;
  color: var(--text-dim);
  font-family: var(--font-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.telemetry-row {
  display: flex;
  align-items: center;
  gap: 16px;
  font-family: var(--font-mono);
  flex-shrink: 0;
}
.telem-item {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  padding-right: 14px;
  border-right: 1px solid rgba(148, 163, 184, 0.14);
}
.telem-item:last-of-type {
  padding-right: 0;
  border-right: none;
}
.telem-lbl {
  font-size: 8.5px;
  text-transform: uppercase;
  color: var(--text-muted);
  letter-spacing: 0.7px;
  margin-bottom: 1px;
  white-space: nowrap;
}
.telem-val {
  font-size: 14px;
  font-weight: 800;
  color: #fff;
  display: flex;
  align-items: baseline;
  gap: 2px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.telem-unit {
  font-size: 9.5px;
  color: var(--text-dim);
  font-weight: 600;
}
.telem-sub {
  font-size: 9px;
  color: var(--accent-emerald);
  font-weight: 700;
  margin-left: 4px;
}
.telem-sep {
  font-size: 11px;
  color: var(--text-muted);
  margin: 0 4px;
  font-weight: 400;
}
.help-pill-btn {
  width: 28px;
  height: 28px;
  padding: 0 !important;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  border: 1px solid var(--border-panel-strong) !important;
  background: rgba(255, 255, 255, 0.04) !important;
  font-weight: 800;
  font-size: 11px;
}
.help-pill-btn:hover {
  border-color: var(--accent-emerald) !important;
  color: var(--accent-emerald) !important;
}

.compat-badge {
  padding: 6px 11px;
  border-radius: 6px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  border: 1px solid rgba(16, 240, 106, 0.5);
  background: rgba(16, 240, 106, 0.12);
  color: var(--accent-emerald);
  cursor: pointer;
  transition: all 0.18s ease;
  font-family: var(--font-mono);
  white-space: nowrap;
  flex-shrink: 0;
}
.compat-badge:hover {
  background: rgba(16, 240, 106, 0.22);
  transform: translateY(-1px);
}
.compat-badge.incompatible {
  border-color: rgba(239, 68, 68, 0.7);
  background: rgba(239, 68, 68, 0.18);
  color: #fca5a5;
  box-shadow: 0 0 14px rgba(239, 68, 68, 0.25);
}
.compat-badge.warning {
  border-color: rgba(245, 158, 11, 0.65);
  background: rgba(245, 158, 11, 0.15);
  color: #fcd34d;
}

/* Compatibility & Clearance Inspector Popover */
.compat-popover {
  align-self: flex-end;
  width: min(460px, 100%);
  background: rgba(8, 12, 18, 0.96);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--border-panel-strong);
  border-radius: 10px;
  padding: 12px 14px;
  pointer-events: auto;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.72);
  display: none;
  flex-direction: column;
  gap: 8px;
}
.compat-popover.open {
  display: flex;
}
.compat-pop-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-panel);
  padding-bottom: 7px;
}
.compat-pop-title {
  font-family: var(--font-display);
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}
.compat-pop-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 220px;
  overflow-y: auto;
}
.compat-issue-row {
  font-family: var(--font-sans);
  font-size: 11px;
  line-height: 1.4;
  padding: 7px 9px;
  border-radius: 6px;
  border-left: 3px solid var(--accent-emerald);
  background: rgba(255, 255, 255, 0.03);
  color: #e2e8f0;
}
.compat-issue-row.err {
  border-left-color: var(--accent-crimson);
  background: rgba(239, 68, 68, 0.1);
  color: #fecaca;
}
.compat-issue-row.warn {
  border-left-color: var(--accent-amber);
  background: rgba(245, 158, 11, 0.1);
  color: #fde68a;
}

/* 3D Viewport Navigation & Tool Dock (Wraps cleanly, zero clipping) */
.viewport-tools {
  position: absolute;
  left: 14px;
  bottom: 14px;
  right: calc(var(--sidebar-w) + 28px);
  z-index: 12;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  transition: right 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.viewport-tools.full-width {
  right: 14px;
}

.tool-group {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg-panel);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border-panel);
  padding: 3px 4px;
  border-radius: 8px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), 0 10px 24px rgba(0, 0, 0, 0.45);
  flex-shrink: 0;
}

.tool-btn {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  padding: 5px 8px;
  border-radius: 5px;
  cursor: pointer;
  transition: all 0.16s ease;
  letter-spacing: 0.3px;
  white-space: nowrap;
}
.tool-btn:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.14);
}
.tool-btn.active {
  color: #040805;
  background: var(--accent-emerald);
  border-color: var(--accent-emerald);
  font-weight: 800;
}
.tool-btn.active-cyan {
  color: var(--accent-emerald);
  background: rgba(16, 240, 106, 0.14);
  border-color: rgba(16, 240, 106, 0.6);
}
.tool-btn.stress-btn.active {
  background: rgba(239, 68, 68, 0.24);
  border-color: var(--accent-crimson);
  color: #fca5a5;
  box-shadow: 0 0 12px rgba(239, 68, 68, 0.28);
}

.zoom-slider-wrap {
  display: flex;
  align-items: center;
  padding: 0 4px;
}
.zoom-slider-wrap input[type=range] {
  width: 64px;
  height: 4px;
  accent-color: var(--accent-emerald);
  cursor: pointer;
}
.zoom-btn {
  font-size: 12px;
  font-weight: 800;
  padding: 4px 7px;
}

.rgb-sync-bar {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 7px;
  margin: 0 2px;
  border-left: 1px solid rgba(148, 163, 184, 0.16);
  border-right: 1px solid rgba(148, 163, 184, 0.16);
}
.rgb-sync-lbl {
  font-family: var(--font-mono);
  font-size: 9px;
  font-weight: 800;
  color: var(--text-muted);
  letter-spacing: 0.4px;
  margin-right: 1px;
}
.rgb-swatch {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1.5px solid rgba(255, 255, 255, 0.25);
  cursor: pointer;
  padding: 0;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.rgb-swatch:hover {
  transform: scale(1.2);
}
.rgb-swatch.active {
  border-color: #ffffff;
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.65);
  transform: scale(1.15);
}
.rgb-swatch.rgb-rainbow {
  background: conic-gradient(#ef4444, #f59e0b, #10f06a, #38bdf8, #a855f7, #ef4444);
}

/* Floating Re-Open Pills */
.floating-reopen-btn {
  position: absolute;
  z-index: 15;
  background: rgba(9, 13, 19, 0.94);
  border: 1px solid rgba(16, 240, 106, 0.65);
  color: #fff;
  padding: 7px 14px;
  border-radius: 8px;
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  display: none;
  align-items: center;
  gap: 8px;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.6), 0 0 14px rgba(16, 240, 106, 0.22);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: all 0.18s ease;
}
.floating-reopen-btn:hover {
  background: var(--accent-emerald);
  color: #040805;
  transform: translateY(-1px);
}
.floating-reopen-btn.right-edge {
  top: 14px;
  right: 14px;
  height: 54px;
}
.floating-reopen-btn.bottom-edge {
  top: 76px;
  left: 14px;
}
.reopen-badge {
  background: rgba(16, 240, 106, 0.16);
  color: var(--accent-emerald);
  font-family: var(--font-mono);
  font-size: 9.5px;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(16, 240, 106, 0.3);
}
.floating-reopen-btn:hover .reopen-badge {
  background: #040805;
  color: var(--accent-emerald);
}

/* Workstation Multi-Panel Sidebar */
.workstation-sidebar {
  position: absolute;
  top: 14px;
  right: 14px;
  bottom: 14px;
  width: var(--sidebar-w);
  background: var(--bg-panel);
  backdrop-filter: blur(26px) saturate(135%);
  -webkit-backdrop-filter: blur(26px) saturate(135%);
  border: 1px solid var(--border-panel);
  border-radius: 12px;
  z-index: 12;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 22px 52px rgba(0, 0, 0, 0.65);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
}
.workstation-sidebar.collapsed {
  transform: translateX(calc(100% + 24px));
  pointer-events: none;
  opacity: 0;
}

.sidebar-header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(5, 8, 13, 0.94);
  border-bottom: 1px solid var(--border-panel);
  padding: 7px 8px;
  gap: 6px;
  flex-shrink: 0;
}
.panel-switcher-tabs {
  display: flex;
  flex: 1;
  min-width: 0;
  gap: 2px;
  background: rgba(0, 0, 0, 0.55);
  padding: 2px;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.07);
  align-items: center;
  height: 32px;
  overflow: hidden;
}

.tab-switch-btn {
  flex: 1 1 auto;
  min-width: 0;
  height: 28px;
  padding: 0 5px;
  font-family: var(--font-display);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.25px;
  text-transform: uppercase;
  background: transparent;
  border: none;
  color: var(--text-dim);
  border-radius: 5px;
  cursor: pointer;
  text-align: center;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
}
.tab-switch-btn:first-child {
  flex: 1.35 0 auto;
}
.tab-switch-btn:hover {
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
}
.tab-switch-btn.active {
  color: #040805 !important;
  background: var(--accent-emerald) !important;
  font-weight: 800;
}
.tab-switch-btn.active .rig-counter-badge {
  background: rgba(0, 0, 0, 0.18);
  border: none;
  color: #040805;
}
.tab-switch-btn.active .badge-num,
.tab-switch-btn.active .badge-total {
  color: #040805;
  font-weight: 800;
}
.tab-switch-btn.active .badge-sep {
  color: rgba(0, 0, 0, 0.45);
}

.rig-counter-badge {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  padding: 1px 4px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 700;
  color: var(--text-dim);
  line-height: 1.1;
}
.badge-num { color: #ffffff; }
.badge-sep { color: rgba(255, 255, 255, 0.4); margin: 0 1px; font-weight: 400; }
.badge-total { color: var(--accent-emerald); }

/* Glitch-free entrance (never starts at opacity:0!) */
@keyframes panelSlideIn {
  0% { transform: translateY(4px); }
  100% { transform: translateY(0); }
}
.panel-view {
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}
.panel-view.tab-entering {
  animation: panelSlideIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
}
.panel-view::-webkit-scrollbar { width: 5px; }
.panel-view::-webkit-scrollbar-track { background: transparent; }
.panel-view::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 3px; }

.panel-close-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--border-panel);
  color: var(--text-dim);
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  transition: all 0.15s;
  flex-shrink: 0;
}
.panel-close-btn:hover {
  background: rgba(239, 68, 68, 0.18);
  border-color: var(--accent-crimson);
  color: #fca5a5;
}

/* Catalog Controls & Filters */
.catalog-search-bar {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-panel);
  background: rgba(255, 255, 255, 0.015);
  display: flex;
  gap: 6px;
  align-items: center;
  flex-shrink: 0;
}
.search-input {
  flex: 1;
  min-width: 0;
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid var(--border-panel);
  border-radius: 6px;
  padding: 7px 10px;
  color: #fff;
  font-family: var(--font-sans);
  font-size: 11.5px;
  outline: none;
}
.search-input:focus {
  border-color: var(--accent-emerald);
}
.sort-select {
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid var(--border-panel);
  border-radius: 6px;
  padding: 7px 8px;
  color: var(--text-dim);
  font-family: var(--font-sans);
  font-size: 11px;
  outline: none;
  cursor: pointer;
}
.compat-filter-btn {
  padding: 7px 9px;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  border-radius: 6px;
  border: 1px solid var(--border-panel);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-dim);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.compat-filter-btn.active {
  background: rgba(16, 240, 106, 0.15);
  border-color: var(--accent-emerald);
  color: var(--accent-emerald);
}

.category-nav {
  display: flex;
  overflow-x: auto;
  padding: 8px 12px;
  gap: 5px;
  border-bottom: 1px solid var(--border-panel);
  scrollbar-width: none;
  background: rgba(0, 0, 0, 0.22);
  flex-shrink: 0;
}
.category-nav::-webkit-scrollbar { display: none; }
.cat-btn {
  padding: 5px 9px;
  font-size: 10.5px;
  font-weight: 600;
  border-radius: 5px;
  border: 1px solid var(--border-panel);
  background: rgba(255, 255, 255, 0.03);
  color: var(--text-dim);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.14s;
  font-family: var(--font-sans);
}
.cat-btn:hover {
  color: #fff;
  border-color: rgba(255, 255, 255, 0.28);
  background: rgba(255, 255, 255, 0.07);
}
.cat-btn.active {
  color: #040805;
  border-color: #fff;
  background: #fff;
  font-weight: 700;
}

.component-feed {
  padding: 12px 12px 20px;
  display: flex;
  flex-direction: column;
  gap: 9px;
}

/* Part Cards */
.part-card {
  background: var(--bg-card);
  border: 1px solid var(--border-panel);
  border-radius: 8px;
  padding: 11px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: border-color 0.16s, background 0.16s, transform 0.16s;
  position: relative;
  flex-shrink: 0;
}
.part-card:hover {
  border-color: var(--border-panel-hover);
  background: var(--bg-card-hover);
}
.part-card.installed {
  border-color: rgba(16, 240, 106, 0.65);
  background: rgba(16, 240, 106, 0.07);
}
.part-card.installed::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;

/* Bottom Floating Gaming Benchmark Tray */
.benchmark-tray {
  position: absolute;
  left: 14px;

  bottom: 62px;
  z-index: 11;
  background: var(--bg-panel);
  backdrop-filter: blur(22px) saturate(135%);
  -webkit-backdrop-filter: blur(22px) saturate(135%);
  border: 1px solid var(--border-panel);
  border-radius: 10px;
  padding: 9px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  pointer-events: auto;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 16px 36px rgba(0, 0, 0, 0.58);
  transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.24s, right 0.28s cubic-bezier(0.16, 1, 0.3, 1);
}
.benchmark-tray.collapsed {
  transform: translateY(calc(100% + 76px));
  pointer-events: none;
  opacity: 0;
}
.benchmark-tray.expanded {
  right: 14px;
}

  text-overflow: ellipsis;
  white-space: nowrap;

.game-meta-box {

}
.game-title {

}

/* 3D Floating Part Labels */
.part-label-tag {
  position: absolute;

  z-index: 6;

  font-size: 9.5px;
  font-weight: 700;
  color: #fff;

  align-items: center;
  gap: 6px;

.interact-toast {

  <script>
// Deterministic, zero-network procedural SVG product art for every hardware item & Steam fallback banner
(function (global) {
  function escXml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function svgUri(svg) {
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  function cpuSvg(c) {
    const isAm5 = c.socket === 'am5';
    const isAm4 = c.socket === 'am4';
    const pcb = isAm5 || isAm4 ? '#064e3b' : '#1e3a8a';
    const pcbStroke = isAm5 || isAm4 ? '#10b981' : '#60a5fa';
    const model = escXml((c.name || '').replace(/^(AMD\s+Ryzen\s+|Intel\s+Core\s+)/i, '').slice(0, 11));
    const brand = isAm5 || isAm4 ? 'RYZEN' : 'INTEL CORE';
    const cutouts = isAm5
      ? '<rect x="18" y="21" width="6" height="4" fill="#d4af37"/><rect x="37" y="21" width="6" height="4" fill="#d4af37"/><rect x="57" y="21" width="6" height="4" fill="#d4af37"/><rect x="18" y="55" width="6" height="4" fill="#d4af37"/><rect x="37" y="55" width="6" height="4" fill="#d4af37"/><rect x="57" y="55" width="6" height="4" fill="#d4af37"/>'
      : '<rect x="20" y="18" width="40" height="44" rx="4" fill="#94a3b8"/>';

    return svgUri(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">' +
      '<defs><linearGradient id="ihs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#cbd5e1"/><stop offset="50%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#64748b"/></linearGradient></defs>' +
      '<rect width="80" height="80" fill="#070b12"/>' +
      '<rect x="12" y="12" width="56" height="56" rx="5" fill="' + pcb + '" stroke="' + pcbStroke + '" stroke-width="1.5"/>' +
      cutouts +
      '<rect x="20" y="22" width="40" height="36" rx="4" fill="url(#ihs)" stroke="#475569" stroke-width="1"/>' +
      '<polygon points="22,24 27,24 22,29" fill="#eab308"/>' +
      '<text x="40" y="36" text-anchor="middle" font-family="monospace" font-size="6.5" font-weight="800" fill="#0f172a">' + brand + '</text>' +
      '<text x="40" y="47" text-anchor="middle" font-family="monospace" font-size="7.2" font-weight="900" fill="#0f172a">' + model + '</text>' +
      '<text x="40" y="55" text-anchor="middle" font-family="monospace" font-size="5" font-weight="700" fill="#334155">' + escXml((c.socket || '').toUpperCase()) + '</text>' +
      '</svg>'
    );
  }

  function gpuSvg(c) {
    const style = c.visualStyle || '';
    const isFe = style === 'founders_hourglass';
    const isRed = style === 'radeon_reference';
    const isBlue = style === 'triple_fan_translucent';
    const isDual = style === 'dual_fan_compact' || isFe;
    const accent = isRed ? '#ef4444' : isBlue ? '#38bdf8' : isFe ? '#e2e8f0' : '#10f06a';
    const bodyColor = isFe ? '#1e2430' : '#111622';
    const fans = isDual ? [28, 52] : [20, 40, 60];
    const fanR = isDual ? 10 : 8.2;
    let fanSvg = '';
    fans.forEach(fx => {
      fanSvg +=
        '<circle cx="' + fx + '" cy="40" r="' + fanR + '" fill="#06090f" stroke="#475569" stroke-width="1.3"/>' +
        '<circle cx="' + fx + '" cy="40" r="3" fill="' + (isBlue ? '#38bdf8' : '#334155') + '"/>' +
        '<path d="M' + fx + ',40 L' + (fx + fanR - 2) + ',37 M' + fx + ',40 L' + (fx - 3) + ',' + (40 + fanR - 2) + ' M' + fx + ',40 L' + (fx - fanR + 2) + ',38" stroke="#64748b" stroke-width="1.4"/>';
    });
    const hourglass = isFe
      ? '<path d="M8,26 L20,40 L8,54 M72,26 L60,40 L72,54" fill="none" stroke="#94a3b8" stroke-width="1.6"/>'
      : '';
    const tag = escXml((c.brand || 'GPU').toUpperCase() + (c.vramGb ? ' ' + c.vramGb + 'G' : ''));
    return svgUri(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">' +
      '<rect width="80" height="80" fill="#070b12"/>' +
      '<rect x="6" y="23" width="68" height="34" rx="4" fill="' + bodyColor + '" stroke="#334155" stroke-width="1.5"/>' +
      '<rect x="14" y="21" width="52" height="3" rx="1" fill="' + accent + '"/>' +
      hourglass +
      fanSvg +
      '<rect x="18" y="57" width="24" height="3" fill="#d4af37"/>' +
      '<text x="40" y="15" text-anchor="middle" font-family="monospace" font-size="6.5" font-weight="800" fill="' + accent + '">' + tag + '</text>' +
      '</svg>'
    );
  }

  function mbSvg(c) {
    const isItx = c.formFactor === 'mini_itx';
    const isSilver = (c.colorway || '').includes('silver');
    const pcb = isSilver ? '#1e293b' : '#0d111a';
    const armor = isSilver ? '#cbd5e1' : '#263042';
    const accent = c.rgbLighting ? '#10f06a' : '#64748b';
    const w = isItx ? 42 : 48;
    const h = isItx ? 42 : 58;
    const x = (80 - w) / 2;
    const y = (80 - h) / 2;

      if (node.isMesh && node.userData && node.userData.isRgbTarget && node.material) {
        if (!node.userData.fixedHue) {

    function colorForPart(partKey) {
      const cpuT = temps.cpu || 45;
      const gpuT = temps.gpu || 42;
      let t = 28;
      if (partKey === 'cpu') t = cpuT;
      else if (partKey === 'gpu') t = gpuT;
      else if (partKey === 'cooler') t = 28 + (cpuT - 25) * 0.52;
      else if (partKey === 'motherboard') t = 34 + (cpuT - 25) * 0.35;
      else if (partKey === 'storage') t = 42 + (gpuT - 30) * 0.25;
      else if (partKey === 'ram') t = 36 + (cpuT - 30) * 0.15;
      else if (partKey === 'psu') t = 35 + (gpuT - 30) * 0.18;
      else t = 25;

      const norm = Math.max(0, Math.min(1, (t - 24) / 62));
      const c = new THREE.Color();
      if (norm < 0.33) {
        c.lerpColors(new THREE.Color(0x1d4ed8), new THREE.Color(0x06b6d4), norm / 0.33);
      } else if (norm < 0.66) {
        c.lerpColors(new THREE.Color(0x06b6d4), new THREE.Color(0xf59e0b), (norm - 0.33) / 0.33);
      } else {
        c.lerpColors(new THREE.Color(0xf59e0b), new THREE.Color(0xef4444), (norm - 0.66) / 0.34);
      }
      return c;
    }

    function detectPartKey(node) {
      let cur = node;
      while (cur) {
        if (cur === meshNodes.cpu) return 'cpu';
        if (cur === meshNodes.gpu) return 'gpu';
        if (cur === meshNodes.cooler) return 'cooler';
        if (cur === meshNodes.motherboard) return 'motherboard';
        if (cur === meshNodes.ram) return 'ram';
        if (cur === meshNodes.storage) return 'storage';
        if (cur === meshNodes.psu) return 'psu';
        cur = cur.parent;
      }
      return 'chassis';
    }

    benchGroup.traverse((node) => {
      if (!node.isMesh || node.userData.isGlass || node === meshNodes.aioScreenMesh) return;
      if (enabled) {
        if (!node.userData.originalMat) {
          node.userData.originalMat = node.material;
        }
        const key = detectPartKey(node);
        const col = colorForPart(key);
        node.material = new THREE.MeshStandardMaterial({
          color: col,
          emissive: col,
          emissiveIntensity: key === 'cpu' || key === 'gpu' ? 0.38 : 0.14,
          roughness: 0.45,
          metalness: 0.25,
          wireframe: node.userData.originalMat.wireframe || false,
        });
      } else if (node.userData.originalMat) {
        if (node.material && node.material !== node.userData.originalMat) {
          node.material.dispose();
        }
        node.material = node.userData.originalMat;
        delete node.userData.originalMat;

    });

    bg.addColorStop(0.5, isSilver ? '#64748b' : isFe ? '#272f3e' : '#18202e');
    bg.addColorStop(1, isSilver ? '#334155' : '#0d121b');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, 1024, 256);

    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    for (let y = 0; y < 256; y += 3) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1024, y); ctx.stroke();
    }

    ctx.strokeStyle = isRed ? '#ef4444' : isFe ? '#64748b' : '#10f06a';
    ctx.lineWidth = 4;
    ctx.strokeRect(12, 12, 1000, 232);

    ctx.fillStyle = '#f8fafc';
    ctx.font = 'bold 34px sans-serif';
    ctx.textAlign = 'left';
    const label = gpu ? gpu.name.toUpperCase().slice(0, 32) : 'GEFORCE RTX 4080 SUPER';
    ctx.fillText(label, 44, 118);

    ctx.fillStyle = isRed ? '#f87171' : '#94a3b8';
    ctx.font = 'bold 18px monospace';
    const sub = (gpu ? gpu.vramGb : 16) + 'GB GDDR6X // ' + (gpu ? gpu.tdpWatts : 320) + 'W TDP // ' + (gpu ? gpu.lengthMm : 304) + 'mm';
    ctx.fillText(sub, 44, 158);
    return srgbTex(c);
  }

  function updateAioLcdDisplay(meshNodes, state) {
    if (!meshNodes.aioCanvas) return;
    const c = meshNodes.aioCanvas;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#060a12';
    ctx.fillRect(0, 0, 256, 256);

    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.arc(128, 128, 110, 0, Math.PI * 2);
    ctx.stroke();

    const tempNorm = Math.min(Math.max((state.cpuTemp - 20) / 75, 0), 1);
    const arcColor = state.cpuTemp > 80 ? '#ef4444' : state.cpuTemp > 65 ? '#f59e0b' : '#10f06a';
    ctx.strokeStyle = arcColor;
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.arc(128, 128, 110, -Math.PI / 2, -Math.PI / 2 + tempNorm * Math.PI * 2);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 14px monospace';

    if (state.aioDisplayMetric === 0) {
      ctx.fillText('CPU PACKAGE', 128, 76);
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 64px monospace';
      ctx.fillText(Math.round(state.cpuTemp) + '°C', 128, 142);
      ctx.fillStyle = arcColor;
      ctx.font = 'bold 15px monospace';
      const rpm = state.stressActive ? '2750 RPM' : (state.fanProfile === 'silent' ? '820 RPM' : '1420 RPM');
      ctx.fillText(rpm, 128, 184);
    } else if (state.aioDisplayMetric === 1) {
      ctx.fillText('COOLANT TEMP', 128, 76);
      ctx.fillStyle = '#38bdf8';
      ctx.font = '900 64px monospace';
      const coolant = Math.round(24 + state.cpuTemp * 0.22);
      ctx.fillText(coolant + '°C', 128, 142);
      ctx.fillStyle = '#10f06a';
      ctx.font = 'bold 15px monospace';
      ctx.fillText('FLOW 2.4 L/M', 128, 184);
    } else {
      ctx.fillText('SYSTEM DRAW', 128, 76);
      ctx.fillStyle = '#f59e0b';
      ctx.font = '900 58px monospace';
      ctx.fillText(Math.round(state.peakWatts || 580) + 'W', 128, 142);
      ctx.fillStyle = '#34d399';
      ctx.font = 'bold 15px monospace';
      ctx.fillText('GPU ' + Math.round(state.gpuTemp) + '°C', 128, 184);
    }

    ctx.fillStyle = '#64748b';
    ctx.font = '11px monospace';
    ctx.fillText('CLICK TO CYCLE', 128, 218);

    if (meshNodes.aioTexture) meshNodes.aioTexture.needsUpdate = true;
  }

  // Helper: Extruded Chamfered Rect Plate with Circular/Rect Holes (Zero Z-fighting!)
  function createPunchedPlateGeometry(w, h, thickness, holesSpec, bevel) {
    const hw = w / 2;
    const hh = h / 2;
    const ch = Math.min(3.5, Math.min(hw, hh) * 0.12);
    const shape = new THREE.Shape();
    shape.moveTo(-hw + ch, -hh);
    shape.lineTo(hw - ch, -hh);
    shape.lineTo(hw, -hh + ch);
    shape.lineTo(hw, hh - ch);
    shape.lineTo(hw - ch, hh);
    shape.lineTo(-hw + ch, hh);
    shape.lineTo(-hw, hh - ch);
    shape.lineTo(-hw, -hh + ch);
    shape.closePath();

    (holesSpec || []).forEach((hole) => {
      const p = new THREE.Path();
      if (hole.type === 'circle') {
        p.absarc(hole.x, hole.y, hole.r, 0, Math.PI * 2, true);
      } else if (hole.type === 'rect') {
        const rx = hole.x - hole.w / 2;
        const ry = hole.y - hole.h / 2;
        p.moveTo(rx, ry);
        p.lineTo(rx, ry + hole.h);
        p.lineTo(rx + hole.w, ry + hole.h);
        p.lineTo(rx + hole.w, ry);
        p.closePath();
      }
      shape.holes.push(p);
    });

    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: thickness,
      bevelEnabled: bevel !== false,
      bevelThickness: bevel !== false ? 0.65 : 0,
      bevelSize: bevel !== false ? 0.55 : 0,
      bevelSegments: 2,
      curveSegments: 28,
    });
    // Normalize UVs cleanly into [0..1] across width & height so procedural CanvasTextures map razor-sharp
    const posAttr = geo.attributes.position;
    const uvAttr = geo.attributes.uv;
    if (posAttr && uvAttr) {
      for (let i = 0; i < posAttr.count; i++) {
        const px = posAttr.getX(i);
        const py = posAttr.getY(i);
        uvAttr.setXY(i, (px + hw) / w, (py + hh) / h);
      }
      uvAttr.needsUpdate = true;
    }
    geo.translate(0, 0, -thickness / 2);
    return geo;
  }

  // Reusable Sculpted Axial Fan Assembly (with Open-Bore Square Frame option!)
  function createAxialFan(radius, bladeCount, opts) {
    const o = opts || {};
    const frameDepth = o.depth || 6.5;
    const axis = o.axis || 'z';
    const bladeColor = o.bladeColor || 0x161d29;
    const emissiveBlade = o.emissiveBlade || 0x000000;
    const haloColor = o.haloColor || null;
    const isReverse = !!o.reverse;
    const squareFrame = !!o.squareFrame;
    const padColor = o.padColor || 0x0a0d14;
    const frameColor = o.frameColor || 0x131823;

    const fanOuter = new THREE.Group();

    // Open-bore chamfered square outer housing (eliminates ugly solid boxes hiding fan blades!)
    if (squareFrame) {
      const boxSpan = o.boxSize || radius * 2.38;
      const boreGeo = createPunchedPlateGeometry(boxSpan, boxSpan, frameDepth, [
        { type: 'circle', x: 0, y: 0, r: radius * 1.03 },
      ]);
      const housingMat = new THREE.MeshStandardMaterial({
        color: frameColor,
        metalness: 0.78,
        roughness: 0.34,
      });
      const housing = new THREE.Mesh(boreGeo, housingMat);
      fanOuter.add(housing);

      // 4 anti-vibration rubber corner pads
      const padOff = boxSpan / 2 - 2.6;
      const padMat = new THREE.MeshStandardMaterial({ color: padColor, roughness: 0.85, metalness: 0.05 });
      [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
        const pad = new THREE.Mesh(new THREE.BoxGeometry(4.5, 4.5, frameDepth + 1.2), padMat);
        pad.position.set(sx * padOff, sy * padOff, 0);
        fanOuter.add(pad);
      });
    }

    const rotor = new THREE.Group();
    rotor.userData.isCenterFan = isReverse;
    rotor.userData.spinAxis = axis;

    const hub = new THREE.Mesh(
      new THREE.CylinderGeometry(radius * 0.31, radius * 0.32, frameDepth * 0.68, 28),
      new THREE.MeshStandardMaterial({ color: 0x0d1119, metalness: 0.92, roughness: 0.16 })
    );
    hub.rotation.x = Math.PI / 2;
    rotor.add(hub);

    const emblem = new THREE.Mesh(
      new THREE.CylinderGeometry(radius * 0.21, radius * 0.21, 0.7, 28),
      new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.96, roughness: 0.12 })
    );
    emblem.rotation.x = Math.PI / 2;
    emblem.position.z = frameDepth * 0.36;
    rotor.add(emblem);

    // Swept Wide Airfoil Blades
    const bladeShape = new THREE.Shape();
    bladeShape.moveTo(radius * 0.26, -radius * 0.14);
    bladeShape.quadraticCurveTo(radius * 0.58, -radius * 0.26, radius * 0.95, -radius * 0.09);
    bladeShape.lineTo(radius * 0.95, radius * 0.17);
    bladeShape.quadraticCurveTo(radius * 0.56, radius * 0.27, radius * 0.26, radius * 0.16);
    bladeShape.closePath();

    const bladeGeo = new THREE.ExtrudeGeometry(bladeShape, {
      depth: 0.45,
      bevelEnabled: true,
      bevelThickness: 0.18,
      bevelSize: 0.14,
      bevelSegments: 1,
    });
    const bladeMat = new THREE.MeshStandardMaterial({
      color: bladeColor,
      emissive: emissiveBlade,
      emissiveIntensity: emissiveBlade ? 0.58 : 0,
      metalness: emissiveBlade ? 0.2 : 0.84,
      roughness: emissiveBlade ? 0.22 : 0.22,
      transparent: !!emissiveBlade,
      opacity: emissiveBlade ? 0.88 : 1,
      side: THREE.DoubleSide,
    });

    for (let b = 0; b < bladeCount; b++) {
      const arm = new THREE.Group();
      arm.rotation.z = (b * Math.PI * 2) / bladeCount;
      const bm = new THREE.Mesh(bladeGeo, bladeMat);
      bm.rotation.x = isReverse ? -0.58 : 0.58;
      bm.position.z = -0.2;
      arm.add(bm);
      rotor.add(arm);
    }

    if (o.outerRing) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(radius * 0.95, 0.72, 10, 36),
        new THREE.MeshStandardMaterial({ color: 0x1a2232, metalness: 0.88, roughness: 0.22 })
      );
      rotor.add(ring);
    }

    if (haloColor) {
      const halo = new THREE.Mesh(
        new THREE.TorusGeometry(radius * 1.02, 0.85, 10, 36),
        new THREE.MeshStandardMaterial({
          color: haloColor,
          emissive: haloColor,
          emissiveIntensity: 0.72,
          roughness: 0.15,
        })
      );
      halo.position.z = frameDepth * 0.42;
      halo.userData.isRgbTarget = true;
      fanOuter.add(halo);
    }

    fanOuter.add(rotor);
    if (axis === 'y') fanOuter.rotation.x = Math.PI / 2;
    else if (axis === 'x') fanOuter.rotation.y = Math.PI / 2;

    return { group: fanOuter, rotor };
  }

  function buildGpuMesh(gpu, verticalMount, benchGroup, meshNodes, disposeFn) {
    if (meshNodes.gpu) {
      benchGroup.remove(meshNodes.gpu);
      disposeFn(meshNodes.gpu);
    }
    meshNodes.gpuFanList = [];
    meshNodes.gpuHeatpipes = [];

    const group = new THREE.Group();
    const style = gpu.visualStyle || 'founders_hourglass';
    const isFe = style === 'founders_hourglass';
    const isStrix = style === 'rog_strix_triple';
    const isRadeon = style === 'radeon_reference';
    const isSilver = style === 'triple_axial_rgb';
    const isSlim = style === 'triple_fan_slim';
    const isIce = style === 'triple_fan_translucent';
    const isDual = style === 'dual_fan_compact' || isFe;

    const length = Math.max(122, Math.min(198, (gpu.lengthMm || 304) * 0.55));
    const depth = isStrix ? 68 : isFe ? 64 : isDual ? 54 : 62;
    const thick = isSlim ? 22 : isStrix ? 34 : isFe ? 28 : 28;
    const xStart = -84;
    const cx = xStart + length / 2;

    // Local GPU assembly: top backplate +Y, sculpted fan shroud -Y, side lightbar +Z, I/O bracket -X
    const cardRoot = new THREE.Group();

    const shroudColor = isSilver ? 0x64748b : isFe ? 0x202632 : 0x131823;
    const accentColor = isRadeon ? 0xef4444 : isIce ? 0x38bdf8 : isFe ? 0xcbd5e1 : 0x10f06a;

    // 1. Stainless Steel I/O Bracket at xStart + Gold-Contact DisplayPort / HDMI ports
    const ioBracket = new THREE.Mesh(
      new THREE.BoxGeometry(2.2, thick + 3, depth + 2),
      new THREE.MeshStandardMaterial({ color: 0xe2e8f0, metalness: 0.96, roughness: 0.14 })

    ioBracket.position.set(xStart - 0.5, 0, 0);
    cardRoot.add(ioBracket);

    const portSlotMat = new THREE.MeshStandardMaterial({ color: 0x060a10, roughness: 0.75, metalness: 0.3 });
    const contactMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.96, roughness: 0.12 });
    const dpCount = isFe ? 3 : 4;
    for (let dp = 0; dp < dpCount; dp++) {
      const pz = -depth * 0.3 + dp * 9;
      const port = new THREE.Mesh(new THREE.BoxGeometry(1.8, 4.5, 6.2), portSlotMat);
      port.position.set(xStart - 1.4, thick * 0.08, pz);
      const contact = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.0, 4.6), contactMat);
      contact.position.set(xStart - 2.0, thick * 0.08, pz);
      cardRoot.add(port, contact);
    }

    // 2. GPU PCB & Gold PCIe x16 Finger Blade
    const gpuPcbLen = isFe ? length * 0.62 : length - 10;
    const gpuPcb = new THREE.Mesh(
      new THREE.BoxGeometry(gpuPcbLen, 2.2, depth - 6),
      new THREE.MeshStandardMaterial({ color: 0x0c1018, roughness: 0.55 })
    );
    gpuPcb.position.set(xStart + gpuPcbLen / 2 + 2, thick * 0.33, -2);
    cardRoot.add(gpuPcb);

    const pcieBlade = new THREE.Mesh(
      new THREE.BoxGeometry(72, 3.2, 2.2),
      new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.96, roughness: 0.12 })
    );
    pcieBlade.position.set(-40, thick * 0.38, -depth * 0.48);
    cardRoot.add(pcieBlade);

    // 3. Enclosed Aluminum Heatsink Fin Core & Contained Copper Heatpipes
    const finMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.92, roughness: 0.24 });
    const finCount = 26;
    for (let f = 0; f < finCount; f++) {
      const fx = xStart + 7 + f * ((length - 16) / finCount);
      const plate = new THREE.Mesh(new THREE.BoxGeometry(1.2, thick * 0.44, depth - 10), finMat);
      plate.position.set(fx, thick * 0.06, 0);
      cardRoot.add(plate);
    }

    const copperMat = new THREE.MeshStandardMaterial({ color: 0xd97706, metalness: 0.96, roughness: 0.14 });
    [-depth * 0.24, depth * 0.24].forEach((hz) => {
      const pipeCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(xStart + 12, 0, hz),
        new THREE.Vector3(xStart + length - 14, 0, hz),
        new THREE.Vector3(xStart + length - 8, 0, hz * 0.45),
      ]);
      const pipe = new THREE.Mesh(new THREE.TubeGeometry(pipeCurve, 16, 1.6, 10, false), copperMat);
      cardRoot.add(pipe);
      meshNodes.gpuHeatpipes.push(pipe);
    });

    // 4. Sculpted Perimeter Frame (Front, Rear & End-Cap Shroud Closure — no open pipe ends!)
    const shroudMat = new THREE.MeshStandardMaterial({ color: shroudColor, metalness: 0.88, roughness: 0.22 });
    const trimMat = new THREE.MeshStandardMaterial({
      color: isFe ? 0x64748b : 0x263042,
      metalness: 0.94,
      roughness: 0.18,
    });

    const sideRailFront = new THREE.Mesh(new THREE.BoxGeometry(length, thick * 0.84, 4.2), shroudMat);
    sideRailFront.position.set(cx, 0, depth / 2 - 2.0);
    sideRailFront.castShadow = true;

    const sideRailRear = new THREE.Mesh(new THREE.BoxGeometry(length, thick * 0.84, 3.6), shroudMat);
    sideRailRear.position.set(cx, 0, -depth / 2 + 1.8);

    const endCap = new THREE.Mesh(new THREE.BoxGeometry(5.5, thick * 0.88, depth), trimMat);
    endCap.position.set(xStart + length - 2.5, 0, 0);
    cardRoot.add(sideRailFront, sideRailRear, endCap);

    // Radeon triple crimson fin inlays
    if (isRadeon) {
      for (let rs = 0; rs < 3; rs++) {
        const stripe = new THREE.Mesh(
          new THREE.BoxGeometry(3.2, thick * 0.72, 4.6),
          new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.85, roughness: 0.25 })
        );
        stripe.position.set(cx + 12 + rs * 7, 0, depth / 2 - 1.8);
        cardRoot.add(stripe);
      }

    // Side Lightbar & Recessed Logo Plate (+Z edge face)

    const logoPlate = new THREE.Mesh(
      new THREE.PlaneGeometry(52, 7.5),
      new THREE.MeshBasicMaterial({ map: logoTex })

    logoPlate.position.set(cx - 22, thick * 0.06, depth / 2 + 0.35);

    if (gpu.rgbLighting || isFe) {

        new THREE.BoxGeometry(barLen, 2.8, 1.4),
        new THREE.MeshStandardMaterial({
          color: accentColor,
          emissive: accentColor,
          emissiveIntensity: isFe ? 0.42 : 0.82,
          roughness: 0.12,
        })
      );
      lightBar.position.set(cx - 8, thick * 0.35, depth / 2 + 0.3);
      if (!isFe && !isRadeon) lightBar.userData.isRgbTarget = true;
      cardRoot.add(lightBar);
      meshNodes.gpuLogoMat = lightBar.material;
    }

    // 5. Brushed Titanium Top Backplate (+Y face) with Real Punched Flow-Through Window!
    const bpTex = createGpuBackplateTexture(gpu);
    const topFlowX = xStart + length - 30;
    const topFlowHoles = isFe
      ? [{ type: 'circle', x: topFlowX - cx, y: 0, r: 19.5 }]

    const bpGeo = createPunchedPlateGeometry(length, depth, 2.4, topFlowHoles);

    cardRoot.add(backplate);

    // Die Core X-Clamp on backplate
    const xClamp = new THREE.Mesh(
      new THREE.BoxGeometry(16, 1.0, 16),
      new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.95, roughness: 0.16 })
    );
    xClamp.position.set(xStart + length * 0.34, thick * 0.51, -4);
    cardRoot.add(xClamp);

    // 6. Sculpted Bottom Fan Shroud Plate (-Y face — HERO SURFACE FOR VERTICAL GPU MOUNT!)
    const fanBladeColor = isIce ? 0x38bdf8 : 0x161d29;
    const fanEmissive = isIce ? 0x0ea5e9 : 0x000000;
    const fanSpecs = [];
    if (isFe) {
      // Iconic FE Hourglass exoskeleton trim on Top + Bottom + 1 Bottom Intake Fan + 1 Top Flow-Through Fan
      fanSpecs.push({ x: xStart + 38, r: 18.5, topFlow: false });

      // Top & Bottom Hourglass Silver Titanium X-Frame
      [thick * 0.48, -thick * 0.44].forEach((hy) => {
        const hg1 = new THREE.Mesh(new THREE.BoxGeometry(length * 0.46, 2.2, 4.4), trimMat);
        hg1.position.set(cx - 4, hy, 0);
        hg1.rotation.y = 0.28;
        const hg2 = hg1.clone();
        hg2.rotation.y = -0.28;
        cardRoot.add(hg1, hg2);
      });

      // Top flow-through exhaust fan cleanly framed inside top backplate hole
      const topFlowFan = createAxialFan(18, 9, { axis: 'y', outerRing: true, bladeColor: 0x11151e });
      topFlowFan.group.position.set(topFlowX, thick * 0.36, 0);
      cardRoot.add(topFlowFan.group);
      meshNodes.gpuFanList.push(topFlowFan.rotor);

      const flowRing = new THREE.Mesh(new THREE.TorusGeometry(19.5, 1.3, 12, 36), trimMat);
      flowRing.rotation.x = Math.PI / 2;
      flowRing.position.set(topFlowX, thick * 0.46, 0);
      cardRoot.add(flowRing);
    } else {
      const fanCount = isDual ? 2 : 3;
      const fanR = isDual ? 16 : 15;
      const span = length - 22;
      for (let i = 0; i < fanCount; i++) {
        fanSpecs.push({
          x: xStart + 11 + (span / fanCount) * (i + 0.5),
          r: fanR,
          reverse: i === 1 && fanCount === 3,
        });
      }
    }

    // Bottom Sculpted Shroud with Punched Circular Fan Cutouts!
    const botHoles = fanSpecs.map((fs) => ({ type: 'circle', x: fs.x - cx, y: 0, r: fs.r + 1.2 }));
    if (isFe) {
      // Exposed louvered intake grille window on FE underside right side
      botHoles.push({ type: 'rect', x: topFlowX - cx, y: 0, w: 42, h: depth * 0.68 });
    }
    const botShroudGeo = createPunchedPlateGeometry(length, depth, 2.8, botHoles);
    const botShroud = new THREE.Mesh(botShroudGeo, shroudMat);
    botShroud.rotation.x = Math.PI / 2;

      const fan = createAxialFan(fs.r, 9, {

      fan.group.position.set(fs.x, -thick * 0.37, 0);

      meshNodes.gpuFanList.push(fan.rotor);

    // 7. Position Horizontal or Vertical Showcase + Combed 3-Strand 12V-2x6 Cable + Anti-Sag Support
    const braidMat = new THREE.MeshStandardMaterial({ color: 0x161b26, roughness: 0.74, metalness: 0.22 });

      );
      riserBase.position.set(-40, 65, 14);
      group.add(riserBase);

      const riserCurve = new THREE.CatmullRomCurve3([

        new THREE.Vector3(-40, 100, -18),
        new THREE.Vector3(-40, 80, 6),
        new THREE.Vector3(-40, 68, 14),
      ]);
      group.add(new THREE.Mesh(new THREE.TubeGeometry(riserCurve, 18, 3.6, 4, false), braidMat));

      // Combed 12V-2x6 cables sweeping cleanly from top back to shroud grommet
      [-3, 0, 3].forEach((ox) => {

      group.add(pwrSock);

      // 3 combed 12V-2x6 strands + CNC aluminum comb
      [-3.2, 0, 3.2].forEach((ox) => {

      const gpuComb = new THREE.Mesh(new THREE.BoxGeometry(11, 4.2, 4.2), trimMat);

        thumbRing.position.set(pilX, 56 + pilH - 2, pilZ);
        group.add(pillar, thumbRing);
      }

    benchGroup.add(group);
    meshNodes.gpu = group;

  function buildCoolerMesh(cooler, state, benchGroup, meshNodes, disposeFn) {

        radFit.position.set(82, radY - 10, radZ + oz);

        const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 36, 3.2, 12, false), tubeMat);
        tube.castShadow = true;
        group.add(tube);

    }
    const startTime = performance.now();
    const diff = end - start;

      const progress = Math.min((now - startTime) / (duration || 380), 1);

      window.Scene3D.applyThermalHeatmap(benchGroup, true, { cpu: currentCpuTemp, gpu: currentGpuTemp }, meshNodes);
    }
  }

  function effectiveTempsFromPower(pData) {
    const profileDelta = selectedFanProfile === 'silent' ? 5 : selectedFanProfile === 'extreme' ? -5 : 0;
    const baseCpu = stressActive ? Math.min(100, pData.cpuLoadTempC + 14) : pData.cpuLoadTempC;
    const baseGpu = stressActive ? Math.min(89, pData.gpuLoadTempC + 11) : pData.gpuLoadTempC;
    return {
      cpu: Math.max(24, baseCpu + profileDelta),
      gpu: Math.max(24, baseGpu + Math.round(profileDelta * 0.7)),
      noise: Math.max(20, (stressActive ? pData.noiseDecibelsLoad + 6 : pData.noiseDecibelsLoad) + (selectedFanProfile === 'silent' ? -6 : selectedFanProfile === 'extreme' ? 5 : 0)),
    };
  }

  function renderCompatPopover() {
    const pop = document.getElementById('compat-popover');
    const list = document.getElementById('compat-pop-list');
    const title = document.getElementById('compat-pop-title');
    if (!pop || !list) return;

    const errs = lastVerifyData.errors || [];
    const warns = lastVerifyData.warnings || [];
    title.textContent = errs.length > 0
      ? errs.length + (errs.length === 1 ? ' Compatibility Issue' : ' Compatibility Issues')
      : warns.length > 0
      ? 'Verified With ' + warns.length + (warns.length === 1 ? ' Advisory' : ' Advisories')
      : 'All Clearances & Envelopes Verified';

    let html = '';
    errs.forEach((e) => {
      html += '<div class="compat-issue-row err"><strong>ERROR:</strong> ' + e + '</div>';
    });
    warns.forEach((w) => {
      html += '<div class="compat-issue-row warn"><strong>NOTICE:</strong> ' + w + '</div>';
    });
    if (errs.length === 0 && warns.length === 0) {
      html = '<div class="compat-issue-row">' + (lastVerifyData.statusSummary || '100% compatible.') + '</div>';
    }
    list.innerHTML = html;
  }

  async function syncBuildAnalysis() {
    const payload = {};
    for (const [k, v] of Object.entries(activeBuild)) {
      if (v) payload[k] = v.id;
    }
    payload.resolution = currentResolution;

    try {
      const [vRes, pRes, bRes] = await Promise.all([
        fetch('/api/verify', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }),
        fetch('/api/power', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }),
        fetch('/api/benchmark', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }),
      ]);

      const vData = await vRes.json();
      const pData = await pRes.json();
      const bData = await bRes.json();

      lastVerifyData = vData;
      lastPowerData = pData;
      currentBenchmarkList = Array.isArray(bData) ? bData : [];

      let displayCost = vData.totalCostUsd || 0;
      if (applyRealMarketPrices) {
        let realTotal = 0;
        for (const v of Object.values(activeBuild)) {
          if (v) {
            const q = liveMarketQuotes[v.id];
            realTotal += q && q.realPrice ? q.realPrice : v.priceUsd;
          }
        }
        displayCost = realTotal;
      }

      const prevCost = window._currentDisplayCost !== undefined ? window._currentDisplayCost : displayCost;
      window._currentDisplayCost = displayCost;
      const costEl = document.getElementById('telem-cost');
      animateRollingNumber(costEl, prevCost, displayCost, 360, (v) =>
        applyRealMarketPrices
          ? '<span style="color:#10f06a;">$' + Math.round(v).toLocaleString() + '</span>'
          : '$' + Math.round(v).toLocaleString()
      );

      const prevW = window._currentDisplayWatts !== undefined ? window._currentDisplayWatts : vData.estimatedPeakWatts;
      window._currentDisplayWatts = vData.estimatedPeakWatts;
      animateRollingNumber(document.getElementById('telem-power'), prevW, vData.estimatedPeakWatts, 360, (v) => Math.round(v));

      const temps = effectiveTempsFromPower(pData);
      const prevC = currentCpuTemp;
      const prevG = currentGpuTemp;
      currentCpuTemp = temps.cpu;
      currentGpuTemp = temps.gpu;
      animateRollingNumber(document.getElementById('telem-thermal-cpu'), prevC, currentCpuTemp, 360, (v) => Math.round(v));
      animateRollingNumber(document.getElementById('telem-thermal-gpu'), prevG, currentGpuTemp, 360, (v) => Math.round(v));

      const noiseEl = document.getElementById('telem-noise');
      if (noiseEl) noiseEl.textContent = temps.noise;

      const badge = document.getElementById('compat-status-btn');
      const errCount = (vData.errors || []).length;
      const warnCount = (vData.warnings || []).length;
      if (errCount > 0) {
        badge.className = 'compat-badge incompatible';
        badge.textContent = errCount + (errCount === 1 ? ' ISSUE' : ' ISSUES');
      } else if (warnCount > 0) {
        badge.className = 'compat-badge warning';
        badge.textContent = warnCount + (warnCount === 1 ? ' NOTICE' : ' NOTICES');
      } else {
        badge.className = 'compat-badge';
        badge.textContent = 'VERIFIED';
      }

      renderCompatPopover();
      window.Models3D.updateAioLcdDisplay(meshNodes, getSceneThermalState());
      if (thermalMode) {
        window.Scene3D.applyThermalHeatmap(benchGroup, true, { cpu: currentCpuTemp, gpu: currentGpuTemp }, meshNodes);
      }

      renderBenchmarks();
      renderChosenRigView();
      renderBuildSpecView();
      renderThermalBenchView();
      renderCatalog();
    } catch (err) {
      console.warn('Sync error:', err);
    }
  }

  // Render View 1: Catalog
  function renderCatalog() {
    const feed = document.getElementById('component-feed');
    if (!feed) return;
    feed.innerHTML = '';

    const query = (document.getElementById('part-search-input')?.value || '').toLowerCase().trim();
    const sortBy = document.getElementById('part-sort-select')?.value || 'featured';
    const kindMap = {
      cpu: 'processor',
      gpu: 'graphics_card',
      mb: 'motherboard',
      ram: 'memory',
      storage: 'storage',
      psu: 'power_supply',
      cooler: 'cooler',
      chassis: 'chassis',
    };

    let filtered = allComponents.filter((c) => {
      const kStr = kindString(c);
      if (activeCategory !== 'all' && kStr !== kindMap[activeCategory]) return false;
      if (query) {
        const hay = ((c.name || '') + ' ' + (c.brand || '') + ' ' + (c.imageBadge || '') + ' ' + (c.socket || '') + ' ' + (c.memType || '')).toLowerCase();
        if (!hay.includes(query)) return false;
      }
      if (compatibleOnlyFilter && checkCandidateCompatibility(c).length > 0) return false;
      return true;
    });

    if (sortBy === 'price-asc') filtered.sort((a, b) => a.priceUsd - b.priceUsd);
    else if (sortBy === 'price-desc') filtered.sort((a, b) => b.priceUsd - a.priceUsd);
    else if (sortBy === 'power') filtered.sort((a, b) => (b.tdpWatts || b.psuWattage || 0) - (a.tdpWatts || a.psuWattage || 0));

    if (filtered.length === 0) {
      feed.innerHTML = '<div style="padding:26px;text-align:center;color:var(--text-muted);font-family:var(--font-mono);font-size:11.5px;">No matching parts found.</div>';
      return;
    }

    filtered.forEach((c) => {
      const slotKey = slotKeyForComp(c);
      const isInstalled = activeBuild[slotKey] && activeBuild[slotKey].id === c.id;
      const issues = isInstalled ? [] : checkCandidateCompatibility(c);

      const card = document.createElement('div');
      card.className = 'part-card' + (isInstalled ? ' installed' : '');

      const bLower = (c.brand || '').toLowerCase();
      let brandClass = 'part-brand-badge';
      if (bLower.includes('amd')) brandClass += ' brand-amd';
      else if (bLower.includes('intel')) brandClass += ' brand-intel';
      else if (bLower.includes('nvidia')) brandClass += ' brand-nvidia';
      else if (bLower.includes('corsair')) brandClass += ' brand-corsair';
      else if (bLower.includes('asus')) brandClass += ' brand-asus';

      const compatBadge = isInstalled
        ? '<span class="part-compat-pill ok">INSTALLED</span>'
        : issues.length === 0
        ? '<span class="part-compat-pill ok">COMPATIBLE</span>'
        : '<span class="part-compat-pill conflict" title="' + issues.join(', ') + '">' + issues[0] + '</span>';

      let specsHtml = '';
      if (c.socket && c.socket !== 'not_applicable') specsHtml += '<span class="spec-pill">' + c.socket.toUpperCase() + '</span>';
      if (c.memType && c.memType !== 'not_applicable') specsHtml += '<span class="spec-pill">' + c.memType.toUpperCase() + '</span>';
      if (c.formFactor && c.formFactor !== 'not_applicable') specsHtml += '<span class="spec-pill">' + c.formFactor.replace('_', '-').toUpperCase() + '</span>';
      if (c.coreCount && kindString(c) === 'processor') specsHtml += '<span class="spec-pill">' + c.coreCount + ' CORES</span>';
      if (c.boostClockMhz) specsHtml += '<span class="spec-pill">' + c.boostClockMhz + ' MHz</span>';
      if (c.vramGb) specsHtml += '<span class="spec-pill">' + c.vramGb + 'GB VRAM</span>';
      if (c.tdpWatts) specsHtml += '<span class="spec-pill">' + c.tdpWatts + 'W TDP</span>';
      if (c.psuWattage) specsHtml += '<span class="spec-pill">' + c.psuWattage + 'W</span>';
      if (c.lengthMm) specsHtml += '<span class="spec-pill">' + c.lengthMm + 'mm</span>';
      if (c.heightMm) specsHtml += '<span class="spec-pill">' + c.heightMm + 'mm H</span>';

      const imgUri = window.HardwareThumbs.getComponentThumbnail(c);
      const quote = liveMarketQuotes[c.id] || {};
      let priceHtml = '<span class="part-price-badge tabular">$' + c.priceUsd + '</span>';
      if (quote && quote.realPrice) {

            '<span class="market-delta-pill ' + deltaClass + '">MKT $' + quote.realPrice + ' (' + deltaSign + quote.deltaUsd + ')</span>' +
          '</div>';

      card.innerHTML =
        '<div class="part-main-row">' +

          '<div class="part-info-col">' +

          '<button class="action-btn btn-inspect">Inspect 3D</button>' +
        '</div>';

      card.querySelector('.btn-install').onclick = () => toggleInstall(c);
      card.querySelector('.btn-inspect').onclick = () => {

        inspectComponent(c);

  // Render View 2: Full System Spec & Verification Matrix
  function renderBuildSpecView() {
    const container = document.getElementById('spec-sheet-container');
    if (!container) return;

    const installedKeys = ['cpu', 'motherboard', 'memory', 'gpu', 'cooler', 'storage', 'psu', 'chassis'];
    let partsHtml = '';
    let totalCost = 0;

    installedKeys.forEach((k) => {
      const comp = activeBuild[k];
      if (comp) {
        const q = liveMarketQuotes[comp.id];
        const partCost = applyRealMarketPrices && q && q.realPrice ? q.realPrice : comp.priceUsd;
        totalCost += partCost;
        partsHtml +=
          '<div class="spec-row">' +
            '<span class="spec-key">' + k.toUpperCase() + ': ' + comp.brand + ' ' + comp.name + '</span>' +
            '<span class="spec-val tabular">$' + partCost + '</span>' +
          '</div>';
      } else {
        partsHtml +=
          '<div class="spec-row">' +
            '<span class="spec-key" style="color:var(--text-muted);">' + k.toUpperCase() + ': Empty</span>' +
            '<span class="spec-val" style="color:var(--text-muted);">-</span>' +
          '</div>';
      }
    });

    const gpuLen = activeBuild.gpu ? activeBuild.gpu.lengthMm : 0;
    const caseMaxGpu = activeBuild.chassis ? activeBuild.chassis.lengthMm : 420;
    const gpuPass = gpuLen <= caseMaxGpu;

    const coolerH = activeBuild.cooler ? activeBuild.cooler.heightMm : 0;
    const caseMaxCooler = activeBuild.chassis ? activeBuild.chassis.heightMm : 170;
    const isAir = activeBuild.cooler && activeBuild.cooler.coolerType === 'air';
    const isRadSffFail = activeBuild.chassis && activeBuild.chassis.formFactor === 'mini_itx' &&
      activeBuild.cooler && (activeBuild.cooler.coolerType === 'liquid_aio_360' || activeBuild.cooler.coolerType === 'liquid_aio_420');
    const coolerPass = isRadSffFail ? false : (!isAir || coolerH <= caseMaxCooler);

    const sockOk = !(activeBuild.cpu && activeBuild.motherboard && activeBuild.cpu.socket !== activeBuild.motherboard.socket);
    const ramOk = !(activeBuild.memory && activeBuild.motherboard && activeBuild.memory.memType !== activeBuild.motherboard.memType);
    const ffOk = !(activeBuild.chassis && activeBuild.motherboard && activeBuild.chassis.formFactor === 'mini_itx' && activeBuild.motherboard.formFactor !== 'mini_itx');
    const psuCap = activeBuild.psu ? activeBuild.psu.psuWattage : 0;
    const psuPass = psuCap >= (lastVerifyData.estimatedPeakWatts || 0);
    const psuHeadroom = psuPass && psuCap >= (lastVerifyData.recommendedPsuWatts || 0);

    container.innerHTML =

        '<div class="spec-row"><span class="spec-key">GPU Length (' + gpuLen + ' / ' + caseMaxGpu + 'mm)</span><span class="' + (gpuPass ? 'clearance-pass' : 'clearance-fail') + '">' + (gpuPass ? 'Cleared' : 'Length Violation') + '</span></div>' +
        '<div class="spec-row"><span class="spec-key">Cooler / Rad Envelope</span><span class="' + (coolerPass ? 'clearance-pass' : 'clearance-fail') + '">' + (coolerPass ? 'Cleared' : 'Clearance Alert') + '</span></div>' +
        '<div class="spec-row"><span class="spec-key">PSU Output (' + psuCap + 'W vs ' + (lastVerifyData.recommendedPsuWatts || 550) + 'W rec)</span><span class="' + (!psuPass ? 'clearance-fail' : psuHeadroom ? 'clearance-pass' : 'clearance-warn') + '">' + (!psuPass ? 'Insufficient' : psuHeadroom ? 'Optimal Headroom' : 'Marginal') + '</span></div>' +
      '</div>' +

      '<div class="spec-section-card">' +
        '<div class="spec-section-header"><span>ATX 3.0 Power Telemetry</span><span>' + (lastPowerData.efficiencyPct || 90) + '% EFF</span></div>' +
        '<div class="spec-row"><span class="spec-key">Desktop Idle</span><span class="spec-val tabular">' + (lastPowerData.idleWatts || 0) + ' W</span></div>' +

        '<div class="spec-row"><span class="spec-key">Est. Annual Energy (4h/day)</span><span class="spec-val tabular">$' + (lastPowerData.annualCostKwh || 0) + ' / yr</span></div>' +

    document.getElementById('btn-export-spec')?.addEventListener('click', () => {

  function epForKind(kind) {
    return {
      processor: 'cpu.json',
      graphics_card: 'video-card.json',
      motherboard: 'motherboard.json',
      memory: 'memory.json',
      storage: 'internal-hard-drive.json',
      power_supply: 'power-supply.json',
      cooler: 'cpu-cooler.json',
      chassis: 'case.json',
    }[kind] || 'cpu.json';
  }

  async function executeLiveBrowserCrawl() {
    if (isCrawlingLive) return;
    isCrawlingLive = true;
    crawlerTerminalLogs.push('[' + new Date().toLocaleTimeString() + '] Fetching GitHub docyx/pc-part-dataset...');
    renderMarketDealsView();

    const endpoints = [
      { kind: 'processor', name: 'cpu.json', url: 'https://raw.githubusercontent.com/docyx/pc-part-dataset/main/data/json/cpu.json' },
      { kind: 'graphics_card', name: 'video-card.json', url: 'https://raw.githubusercontent.com/docyx/pc-part-dataset/main/data/json/video-card.json' },
      { kind: 'motherboard', name: 'motherboard.json', url: 'https://raw.githubusercontent.com/docyx/pc-part-dataset/main/data/json/motherboard.json' },
      { kind: 'memory', name: 'memory.json', url: 'https://raw.githubusercontent.com/docyx/pc-part-dataset/main/data/json/memory.json' },
      { kind: 'storage', name: 'internal-hard-drive.json', url: 'https://raw.githubusercontent.com/docyx/pc-part-dataset/main/data/json/internal-hard-drive.json' },
      { kind: 'power_supply', name: 'power-supply.json', url: 'https://raw.githubusercontent.com/docyx/pc-part-dataset/main/data/json/power-supply.json' },
      { kind: 'cooler', name: 'cpu-cooler.json', url: 'https://raw.githubusercontent.com/docyx/pc-part-dataset/main/data/json/cpu-cooler.json' },
      { kind: 'chassis', name: 'case.json', url: 'https://raw.githubusercontent.com/docyx/pc-part-dataset/main/data/json/case.json' },
    ];

    const datasets = {};
    let total = 0;
    for (const ep of endpoints) {
      try {
        const t0 = performance.now();
        const res = await fetch(ep.url);
        const data = await res.json();
        datasets[ep.kind] = data;
        total += data.length;
        crawlerTerminalLogs.push('[HTTP ' + res.status + '] ' + ep.name + ': ' + data.length.toLocaleString() + ' rows (' + Math.round(performance.now() - t0) + 'ms)');
      } catch (err) {
        crawlerTerminalLogs.push('[WARN] ' + ep.name + ': ' + err.message);
      }
      renderMarketDealsView();
    }

    let matched = 0;
    allComponents.forEach((c) => {
      const list = datasets[c.kind] || [];
      const cleanName = c.name.toLowerCase();
      const brandLower = c.brand.toLowerCase();
      const idKey = c.id.replace(/^(cpu_|gpu_|mb_|ram_|ssd_|psu_|cooler_|case_)/, '').toLowerCase();
      const candidates = list.filter((item) => {
        if (!item.name || !item.price || item.price <= 0) return false;
        const itemName = item.name.toLowerCase();
        const chipset = (item.chipset || '').toLowerCase();
        const idTokens = idKey.split('_').filter((t) => t.length >= 2);
        if (idTokens.every((tok) => itemName.includes(tok) || chipset.includes(tok))) return true;
        const nameTokens = cleanName.split(/[\s-]+/).filter((t) => t.length >= 3 && !['edition', 'gaming', 'series', 'super', 'plus', 'pro'].includes(t));
        const modelNum = nameTokens.find((t) => /\d+/.test(t));
        if (modelNum && !(itemName.includes(modelNum) || chipset.includes(modelNum))) return false;
        return nameTokens.filter((t) => itemName.includes(t) || chipset.includes(t)).length >= 2;
      });
      const best = candidates.find((item) => item.name.toLowerCase().includes(brandLower)) || candidates[0];
      if (best) {
        matched++;
        const scrapedPrice = Math.round(typeof best.price === 'number' ? best.price : parseFloat(best.price));
        const delta = scrapedPrice - c.priceUsd;
        liveMarketQuotes[c.id] = {
          id: c.id,
          matchedName: best.name,
          realPrice: scrapedPrice,
          basePrice: c.priceUsd,
          deltaUsd: delta,
          deltaPct: parseFloat(((delta / c.priceUsd) * 100).toFixed(1)),
          retailerSource: 'PCPartPicker Live Scraped Index',
          datasetUrl: 'https://raw.githubusercontent.com/docyx/pc-part-dataset/main/data/json/' + epForKind(c.kind),
          rawMatch: best,
        };
      }
    });

    crawlerTerminalLogs.push('[DONE] Processed ' + total.toLocaleString() + ' records, matched ' + matched + ' parts.');
    isCrawlingLive = false;
    renderMarketDealsView();
    syncBuildAnalysis();
  }

          '<button class="crawler-action-btn ' + (isCrawlingLive ? '' : 'active-green') + '" id="btn-live-browser-crawl">' + (isCrawlingLive ? 'Downloading...' : 'Fetch Live Prices') + '</button>' +

    const logBox = document.getElementById('crawler-log-box');

    document.getElementById('btn-live-browser-crawl')?.addEventListener('click', executeLiveBrowserCrawl);
    document.getElementById('btn-sync-backend-prices')?.addEventListener('click', async () => {
      try {

  // Render View 4: Real Cooler-Aware Thermals & Acoustics
  function renderThermalBenchView() {
    const container = document.getElementById('thermal-bench-container');
    if (!container) return;

    const p = lastPowerData;
    const temps = effectiveTempsFromPower(p);
    const hasCooler = !!activeBuild.cooler;
    const isAir = activeBuild.cooler && activeBuild.cooler.coolerType === 'air';
    const isThrottling = p.thermalThrottling || temps.cpu >= 95;

    const cpuColor = temps.cpu >= 88 ? '#ef4444' : temps.cpu >= 72 ? '#f59e0b' : '#10f06a';
    const gpuColor = temps.gpu >= 80 ? '#ef4444' : temps.gpu >= 70 ? '#f59e0b' : '#38bdf8';
    const coolantTemp = Math.round(24 + temps.cpu * 0.22);
    const vrmTemp = Math.round(32 + (activeBuild.cpu ? activeBuild.cpu.tdpWatts * 0.11 : 8) + (stressActive ? 10 : 0));

    const coolerRows = !hasCooler
      ? '<div class="spec-row"><span class="spec-key">Cooler Status</span><span class="clearance-fail">NO COOLER INSTALLED (THROTTLING)</span></div>'
      : isAir
      ? '<div class="spec-row"><span class="spec-key">Heatpipe Fin Stack Delta</span><span class="spec-val tabular">+' + Math.max(8, Math.round((temps.cpu - 24) * 0.35)) + '°C</span></div>' +
        '<div class="spec-row"><span class="spec-key">Tower Fan Speed</span><span class="spec-val tabular">' + (selectedFanProfile === 'silent' ? '780' : selectedFanProfile === 'extreme' ? '1,950' : '1,240') + ' RPM</span></div>'
      : '<div class="spec-row"><span class="spec-key">Liquid Coolant Loop</span><span class="spec-val tabular">' + coolantTemp + '°C</span></div>' +
        '<div class="spec-row"><span class="spec-key">AIO Pump Tachometer</span><span class="spec-val tabular">' + (stressActive || selectedFanProfile === 'extreme' ? '2,750' : selectedFanProfile === 'silent' ? '1,650' : '2,250') + ' RPM</span></div>';

    container.innerHTML =
      '<div class="spec-section-card">' +
        '<div class="spec-section-header"><span>Fan & Pump Acoustic Curve</span><span>' + selectedFanProfile.toUpperCase() + '</span></div>' +
        '<div style="display:flex;gap:6px;">' +
          '<button class="action-btn ' + (selectedFanProfile === 'silent' ? 'primary' : '') + '" data-fan="silent">Silent</button>' +

        '<div class="thermal-meter-wrap">' +

  function triggerOnlineSteamSearch(query) {
    if (!query || query.length < 2) return;
    if (onlineSearchDebounce) clearTimeout(onlineSearchDebounce);
    onlineSearchDebounce = setTimeout(async () => {
      try {
        const gpuId = activeBuild.gpu ? activeBuild.gpu.id : '';
        const res = await fetch('/api/games/online?query=' + encodeURIComponent(query) + '&resolution=' + encodeURIComponent(currentResolution) + '&gpu=' + encodeURIComponent(gpuId));
        if (!res.ok) return;
        const onlineGames = await res.json();
        if (!Array.isArray(onlineGames) || onlineGames.length === 0) return;
        const currentQ = (document.getElementById('game-search-input')?.value || document.getElementById('sidebar-game-search')?.value || '').toLowerCase().trim();
        if (currentQ !== query) return;
        renderGameCards(onlineGames);

  // Render Loop (Delta-Time Normalized for 60fps & Software WebGL Consistency)
  let lastFrameTime = performance.now();
  function animate() {
    requestAnimationFrame(animate);
    const now = performance.now();
    const rawDt = Math.max(0.001, (now - lastFrameTime) / 1000);
    const dt = Math.min(rawDt, 0.25);
    lastFrameTime = now;

    const camAlpha = 1 - Math.exp(-8.5 * dt);
    if (isCameraTransitioning) {
      camera.position.lerp(targetCameraPos, camAlpha);
      controls.target.lerp(targetCameraTarget, camAlpha);
      controls.update();
      if (camera.position.distanceTo(targetCameraPos) < 0.7 && controls.target.distanceTo(targetCameraTarget) < 0.7) {
        camera.position.copy(targetCameraPos);
        controls.target.copy(targetCameraTarget);
        isCameraTransitioning = false;
      }
    } else {
      controls.update();
    }

    if (zoomSlider) {
      const curDist = camera.position.distanceTo(controls.target);
      if (Math.abs(parseFloat(zoomSlider.value) - curDist) > 3) zoomSlider.value = Math.round(curDist);
    }

    const targetExplode = exploded ? 1 : 0;
    const expAlpha = 1 - Math.exp(-10 * dt);
    explodeProgress += (targetExplode - explodeProgress) * expAlpha;

    if (meshNodes.gpu) meshNodes.gpu.position.z = 75 * explodeProgress;
    if (meshNodes.cooler) meshNodes.cooler.position.z = 52 * explodeProgress;
    if (meshNodes.ram) meshNodes.ram.position.z = 42 * explodeProgress;
    if (meshNodes.storage) meshNodes.storage.position.z = 28 * explodeProgress;
    if (meshNodes.psu) meshNodes.psu.position.set(-62 - 48 * explodeProgress, 30, 12 + 32 * explodeProgress);

    const isTerraCase = !!(activeBuild.chassis && activeBuild.chassis.id.includes('terra'));
    if (meshNodes.caseLeftDoor) meshNodes.caseLeftDoor.position.z = (isTerraCase ? 50 : 84) + 76 * explodeProgress;
    if (meshNodes.caseFront) meshNodes.caseFront.position.x = (isTerraCase ? 98 : 121) + 72 * explodeProgress;
    if (meshNodes.caseTop) meshNodes.caseTop.position.y = (isTerraCase ? 226 : 252) + 52 * explodeProgress;
    if (meshNodes.caseRight) meshNodes.caseRight.position.z = -86 - 52 * explodeProgress;

    if (activeRgbTheme === 'rainbow' && !thermalMode) {
      const hueColor = new THREE.Color().setHSL((now * 0.00018) % 1, 0.9, 0.55);
      window.Scene3D.applyRgbSyncColor(sceneCtx, '#' + hueColor.getHexString());
    }

    const spinRate = (stressActive ? 14 : selectedFanProfile === 'silent' ? 2.4 : selectedFanProfile === 'extreme' ? 11 : 5.2) * Math.min(dt, 0.1);
    meshNodes.gpuFanList.forEach((f) => {
      f.rotation.z += f.userData.isCenterFan ? -spinRate * 1.08 : spinRate;
    });
    meshNodes.chassisFanList.forEach((f) => { if (f) f.rotation.z += spinRate; });
    meshNodes.caseFanList.forEach((f) => { if (f) f.rotation.z += spinRate; });
    meshNodes.coolerFanList.forEach((f) => { if (f) f.rotation.z += spinRate * 1.15; });

    updateSpatialLabels();
    renderer.render(scene, camera);
  }
  animate();

  function handleResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener('resize', handleResize);

  // Bootstrap Catalog, Default Showcase Build & Shareable URL (?rig=...)
  async function loadCatalog() {
    try {
      const cRes = await fetch('/api/components');
      if (cRes.ok) allComponents = await cRes.json();
    } catch (err) {
      console.warn('Components fetch error:', err);
    }
    try {
      const pRes = await fetch('/api/live-prices');
      if (pRes.ok) {
        const pData = await pRes.json();
        liveMarketQuotes = pData.quotes || {};
      }
    } catch (e) {}

    if (allComponents.length > 0) {
      const find = (id) => allComponents.find((c) => c.id === id);
      activeBuild.cpu = find('cpu_7800x3d') || allComponents[0];
      activeBuild.motherboard = find('mb_b650e');
      activeBuild.gpu = find('gpu_rtx_4080s') || find('gpu_rtx_4090');
      activeBuild.memory = find('ram_dominator_titanium_64gb');
      activeBuild.cooler = find('cooler_icue_titan_360');
      activeBuild.psu = find('psu_rm1000x_shift');
      activeBuild.storage = find('ssd_samsung_990pro');
      activeBuild.chassis = find('case_5000d_airflow');

      const params = new URLSearchParams(window.location.search);
      const rigParam = params.get('rig');
      if (rigParam) {
        rigParam.split(',').forEach((pair) => {
          const [k, v] = pair.split('=');
          if (k && v && Object.prototype.hasOwnProperty.call(activeBuild, k)) {
            const match = find(decodeURIComponent(v));
            if (match) activeBuild[k] = match;
          }
        });
      }
    }

    update3DScene();
    refreshAllViews();
    syncBuildAnalysis();
  }
  loadCatalog();
})();

  </script>
</body>
</html>
